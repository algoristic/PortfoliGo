@let users = usersFacade.users$ | async;
@let activeUser = usersFacade.activeUser$ | async;

<ion-header [translucent]="true">
  <ion-toolbar>
    @if (activeUser) {
      <ion-button fill="clear" shape="round" slot="start" (click)="router.navigate(['app'])">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    }
    <ion-title>Profil wählen</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-padding">
    <ion-button expand="block" (click)="router.navigate(['user/create'])">Neues Profil</ion-button>
  </div>
  @if (users && users.length > 0) {
    <ion-list>
      @for (user of users; track user.id) {
        <ion-item>
          <ion-avatar slot="start">
            <img alt="Dummy Avatar" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
          </ion-avatar>
          <ion-label>{{ user.name }}</ion-label>
          <ion-button
            fill="clear"
            shape="round"
            color="danger"
            (click)="usersFacade.requestDeleteUser(user)">
            <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
          </ion-button>
          <ion-button fill="clear" shape="round" (click)="usersFacade.selectActiveUser(user)">
            <ion-icon name="arrow-forward-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
