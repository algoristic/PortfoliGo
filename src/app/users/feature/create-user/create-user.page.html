<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <app-logo></app-logo>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-padding">
    <ion-text>
      <p>Herzlich wilkommen bei <app-inline-logo variant="italic"></app-inline-logo>!</p>
    </ion-text>
    <ion-text>
      <p>Erstellen Sie einen neuen Nutzer, um zu starten:</p>
    </ion-text>
  </div>
  <form [formGroup]="createUserForm">
    <ion-list>
      <ion-item>
        <ion-input
          formControlName="name"
          label="Benutzername"
          labelPlacement="floating"></ion-input>
      </ion-item>
      <ion-item>
        <!-- TODO input-masks -->
        <ion-input
          formControlName="startingCapital"
          label="Startkapital"
          labelPlacement="floating"
          type="number"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          formControlName="monthlySavingsAmount"
          label="Monatlicher Sparbetrag"
          labelPlacement="floating"
          type="number"></ion-input>
      </ion-item>
    </ion-list>
  </form>
</ion-content>
