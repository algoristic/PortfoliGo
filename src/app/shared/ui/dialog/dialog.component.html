<div appCard padding="none" class="dialog flex w-full flex-col text-fg shadow-xl">
  <!-- Not <header>/<footer>: inside a dialog they would become extra banner and contentinfo
       landmarks of the page (TS §11.10). -->
  <div class="flex shrink-0 items-center justify-between gap-2 border-b border-border px-4 py-3">
    <h2 class="text-base font-semibold">{{ heading() }}</h2>
    <button
      type="button"
      class="-m-1 rounded p-1 text-fg-muted hover:text-fg"
      [attr.aria-label]="closeLabel"
      [attr.title]="closeLabel"
      [attr.data-testid]="testId() + '.close'"
      (click)="onClose()">
      <i appIcon="x-lg"></i>
    </button>
  </div>
  <div class="min-h-0 flex-1 overflow-y-auto px-4 py-4 text-sm">
    <ng-content />
  </div>
  <div class="flex shrink-0 flex-wrap justify-end gap-2 border-t border-border px-4 py-3">
    <ng-content select="[dialogActions]" />
  </div>
</div>
