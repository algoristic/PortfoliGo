@let _change = change();

<div class="flex flex-col gap-1 rounded-lg border border-border bg-surface p-4">
  <span class="text-xs font-medium text-fg-muted">{{ label() }}</span>
  <span class="text-xl font-semibold tabular-nums">{{ value() }}</span>
  @if (_change !== undefined) {
    <app-price-change class="text-sm" [value]="_change" [mode]="changeMode()"></app-price-change>
  }
</div>
