@let _change = change();

<div appCard class="flex flex-col gap-1">
  <span class="text-xs font-medium text-fg-muted">{{ label() }}</span>
  <span class="text-xl font-semibold tabular-nums"
    >{{ value() }}
    @if (showUnit()) {
      <span class="text-sm font-normal text-fg-muted">{{ unit() }}</span>
    }
  </span>
  @if (_change !== undefined) {
    <app-price-change class="text-sm" [value]="_change" [mode]="changeMode()"></app-price-change>
  }
</div>
