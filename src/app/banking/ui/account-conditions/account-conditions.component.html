<dl class="flex flex-col gap-2">
  @for (item of items(); track item.id) {
    <div class="flex flex-col gap-x-4 sm:flex-row">
      <dt class="shrink-0 text-fg-muted sm:w-44">{{ item.label }}</dt>
      <dd class="tabular-nums" [attr.data-testid]="testId() + '.' + item.id">{{ item.value }}</dd>
    </div>
  }
</dl>
