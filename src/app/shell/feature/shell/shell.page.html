<button
  type="button"
  class="sr-only rounded-md bg-accent px-4 py-2 text-sm font-medium text-bg focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50"
  data-testid="shell.skip-to-content"
  (click)="onSkipToContent()">
  {{ skipLinkLabel }}
</button>

<div class="flex min-h-dvh flex-col">
  <app-section-header
    class="sticky top-0 z-20"
    [compact]="!isDesktop()"
    (selectedPlayerMenuAction)="onSelectPlayerMenuAction($event)"></app-section-header>

  <div class="flex flex-1">
    @if (isDesktop()) {
      <app-section-side-nav
        class="sticky top-14 w-56 shrink-0 self-start"
        [items]="navItems"></app-section-side-nav>
    }

    <main
      #content
      id="content"
      tabindex="-1"
      class="min-w-0 flex-1 p-4 focus:outline-none md:border-l md:border-border md:p-6"
      [class.pb-24]="!isDesktop()">
      <router-outlet />
    </main>
  </div>

  @if (!isDesktop()) {
    <app-section-bottom-nav
      class="fixed inset-x-0 bottom-0 z-20"
      [items]="bottomNavItems"
      [moreItems]="moreNavItems"
      (selectedMenuItem)="onSelectNavItem($event)"></app-section-bottom-nav>
  }
</div>
