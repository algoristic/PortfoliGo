@let _activeOptionId = activeOptionId();

<div
  class="flex w-full flex-col overflow-hidden rounded-lg border border-border bg-surface text-fg shadow-xl">
  <div class="flex items-center gap-2 border-b border-border px-3">
    <i appIcon="search" class="text-fg-muted"></i>
    <input
      type="text"
      role="combobox"
      aria-autocomplete="list"
      aria-expanded="true"
      autocomplete="off"
      spellcheck="false"
      class="h-12 min-w-0 flex-1 bg-transparent text-base text-fg placeholder:text-fg-muted focus:outline-none"
      data-testid="shell.command-palette.input"
      [attr.aria-label]="inputLabel"
      [attr.placeholder]="inputLabel + ' …'"
      [attr.aria-controls]="listboxId"
      [attr.aria-activedescendant]="_activeOptionId"
      [value]="query()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)" />
    <button
      type="button"
      class="rounded p-1 text-fg-muted hover:text-fg"
      data-testid="shell.command-palette.close"
      [attr.aria-label]="closeLabel"
      [attr.title]="closeLabel"
      (click)="decline()">
      <i appIcon="x-lg"></i>
    </button>
  </div>

  <ul
    role="listbox"
    class="max-h-96 overflow-y-auto py-1"
    data-testid="shell.command-palette.list"
    [id]="listboxId"
    [attr.aria-label]="inputLabel">
    @for (option of options(); track option.id) {
      <!-- Options are chosen with the arrow keys in the field; the click is for pointers. -->
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
      <li
        role="option"
        class="mx-1 flex cursor-pointer items-center gap-3 rounded-md px-3 py-2 text-sm aria-selected:bg-surface-raised"
        [id]="option.optionId"
        [attr.aria-selected]="option.optionId === _activeOptionId"
        [attr.data-testid]="'shell.command-palette.option.' + option.id"
        (click)="onSelect(option)">
        <i class="text-fg-muted" [appIcon]="option.icon"></i>
        <span class="flex min-w-0 flex-1 flex-col">
          <span class="truncate">{{ option.label }}</span>
          @if (option.hint) {
            <span class="truncate text-xs text-fg-muted">{{ option.hint }}</span>
          }
        </span>
        <span class="shrink-0 text-xs text-fg-muted">{{ option.groupLabel }}</span>
      </li>
    }
  </ul>

  <p
    role="status"
    class="border-t border-border px-3 py-2 text-xs text-fg-muted"
    data-testid="shell.command-palette.status">
    {{ resultText() }}
    <span class="max-md:hidden" i18n="@@featureShell-dialogCommandPalette-keys"
      >Pfeiltasten wählen, Enter führt aus, Esc schließt.</span
    >
  </p>
</div>
