<header
  class="flex h-14 items-center gap-3 border-b border-border bg-surface px-3 md:gap-4 md:px-4">
  <a
    routerLink="dashboard"
    class="rounded text-base font-semibold text-accent"
    data-testid="shell.header.home"
    >PortfoliGo</a
  >

  <div class="flex items-center gap-2 text-sm text-fg-muted" [attr.title]="clockLabel">
    <i class="bi bi-clock" aria-hidden="true"></i>
    <span class="sr-only">{{ clockLabel }}</span>
    <span class="tabular-nums" data-testid="shell.header.clock">–</span>
  </div>

  @if (!compact()) {
    <div class="flex items-center gap-2 text-sm">
      <span class="text-fg-muted">{{ netWorthLabel }}</span>
      <span class="font-semibold tabular-nums" data-testid="shell.header.net-worth">–</span>
    </div>
  }

  <div class="ml-auto flex items-center gap-1">
    @if (!compact()) {
      <label class="relative mr-2 block">
        <span class="sr-only">{{ searchLabel }}</span>
        <i
          class="bi bi-search pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-fg-muted"
          aria-hidden="true"></i>
        <input
          type="search"
          [disabled]="true"
          class="h-9 w-56 rounded-md border border-border bg-bg pr-3 pl-9 text-sm text-fg placeholder:text-fg-muted disabled:cursor-not-allowed"
          data-testid="shell.header.search"
          [attr.placeholder]="searchLabel + ' …'" />
      </label>
    }

    <a
      appIconButton
      routerLink="notifications"
      data-testid="shell.header.notifications"
      [label]="notificationsLabel">
      <i class="bi bi-bell" aria-hidden="true"></i>
    </a>

    <div class="relative">
      <button
        appIconButton
        ngMenuTrigger
        type="button"
        data-testid="shell.header.player-menu"
        [label]="playerMenuLabel"
        [menu]="playerMenu">
        <i class="bi bi-person-circle" aria-hidden="true"></i>
      </button>
      <div
        ngMenu
        #playerMenu="ngMenu"
        class="absolute top-full right-0 z-30 mt-1 min-w-56 rounded-md border border-border bg-surface-raised p-1 shadow-lg"
        [attr.aria-label]="playerMenuLabel"
        (itemSelected)="onSelectPlayerMenuAction($event)">
        <div
          ngMenuItem
          value="switch-player"
          class="flex cursor-pointer items-center gap-3 rounded px-3 py-2 text-sm hover:bg-surface focus-visible:bg-surface"
          data-testid="shell.header.player-menu.switch-player">
          <i class="bi bi-people text-fg-muted" aria-hidden="true"></i>
          <ng-container i18n="@@uiShell-sectionHeader-switchPlayer">Spieler wechseln</ng-container>
        </div>
        <div
          ngMenuItem
          value="settings"
          class="flex cursor-pointer items-center gap-3 rounded px-3 py-2 text-sm hover:bg-surface focus-visible:bg-surface"
          [class.text-accent]="isSettingsActive()"
          [class.font-medium]="isSettingsActive()"
          [attr.aria-current]="isSettingsActive() ? 'page' : null"
          data-testid="shell.header.player-menu.settings">
          <i class="bi bi-gear" [class.text-fg-muted]="!isSettingsActive()" aria-hidden="true"></i>
          <span class="flex-1" i18n="@@uiShell-sectionHeader-settings">Einstellungen</span>
          @if (isSettingsActive()) {
            <i class="bi bi-check2" aria-hidden="true"></i>
          }
        </div>
        <div
          ngMenuItem
          value="export"
          [disabled]="true"
          class="flex cursor-not-allowed items-center gap-3 rounded px-3 py-2 text-sm text-fg-muted"
          data-testid="shell.header.player-menu.export">
          <i class="bi bi-box-arrow-up" aria-hidden="true"></i>
          <ng-container i18n="@@uiShell-sectionHeader-export">Exportieren</ng-container>
        </div>
      </div>
    </div>
  </div>
</header>
