<nav class="border-t border-border bg-surface" [attr.aria-label]="navLabel">
  <ul class="grid grid-cols-5">
    @for (item of items(); track item.path) {
      <li>
        <a
          #link="routerLinkActive"
          class="flex h-16 flex-col items-center justify-center gap-1 px-1 text-center text-xs leading-tight font-medium"
          [class]="link.isActive ? 'text-accent' : 'text-fg-muted hover:text-fg'"
          [routerLink]="item.path"
          routerLinkActive
          ariaCurrentWhenActive="page"
          [attr.data-testid]="'shell.bottom-nav.' + item.path">
          <i class="bi text-lg" [class]="'bi-' + item.icon" aria-hidden="true"></i>
          {{ item.label }}
        </a>
      </li>
    }
    <li class="relative">
      <button
        ngMenuTrigger
        type="button"
        class="flex h-16 w-full flex-col items-center justify-center gap-1 px-1 text-center text-xs leading-tight font-medium"
        [class]="isMoreActive() ? 'text-accent' : 'text-fg-muted hover:text-fg'"
        data-testid="shell.bottom-nav.more"
        [menu]="moreMenu">
        <i class="bi bi-three-dots text-lg" aria-hidden="true"></i>
        {{ moreLabel }}
      </button>
      <div
        ngMenu
        #moreMenu="ngMenu"
        class="absolute right-2 bottom-full z-30 mb-2 min-w-56 rounded-md border border-border bg-surface-raised p-1 shadow-lg"
        [attr.aria-label]="moreLabel"
        (itemSelected)="onSelectMenuItem($event)">
        @for (item of moreItems(); track item.path) {
          @let isActive = item.path === activePath();
          <div
            ngMenuItem
            class="flex cursor-pointer items-center gap-3 rounded px-3 py-2 text-sm hover:bg-surface focus-visible:bg-surface"
            [class.text-accent]="isActive"
            [class.font-medium]="isActive"
            [attr.aria-current]="isActive ? 'page' : null"
            [value]="item.path"
            [attr.data-testid]="'shell.bottom-nav.more.' + item.path">
            <i
              class="bi text-base"
              [class]="'bi-' + item.icon"
              [class.text-fg-muted]="!isActive"
              aria-hidden="true"></i>
            <span class="flex-1">{{ item.label }}</span>
            @if (isActive) {
              <i class="bi bi-check2" aria-hidden="true"></i>
            }
          </div>
        }
      </div>
    </li>
  </ul>
</nav>
