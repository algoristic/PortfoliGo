<nav class="p-3" [attr.aria-label]="navLabel">
  <ul class="flex flex-col gap-1">
    @for (item of items(); track item.path) {
      <li>
        <a
          appNavLink
          [routerLink]="item.path"
          routerLinkActive
          ariaCurrentWhenActive="page"
          [attr.data-testid]="'shell.side-nav.' + item.path">
          <i class="text-base" [appIcon]="item.icon"></i>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
