@let rows = facade.watchlistRows$ | async;
@let known = facade.watchlistKnown$ | async;
@let saving = facade.watchlistSaving$ | async;

<app-panel>
  @if (rows && rows.length > 0) {
    <app-watchlist-list
      [rows]="rows"
      [saving]="saving ?? false"
      (droppedItem)="onDrop($event, rows)"
      (movedItem)="onMove($event, rows)"
      (clickedRemove)="onRemove($event)"></app-watchlist-list>
  } @else if (known) {
    <app-empty-state
      icon="star"
      heading="Deine Watchlist ist leer"
      i18n-heading="@@featureMarket-watchlistPage-emptyListHeading"
      text="Markiere Wertpapiere im Screener oder auf ihrer Seite mit dem Stern, um ihre Kurse hier zu verfolgen."
      i18n-text="@@featureMarket-watchlistPage-emptyListText"
      data-testid="market.watchlist.empty">
      <a
        appButton
        routerLink="../screener"
        data-testid="market.watchlist.open-screener"
        i18n="@@featureMarket-watchlistPage-openScreener"
        >Zum Screener</a
      >
    </app-empty-state>
  }
</app-panel>
