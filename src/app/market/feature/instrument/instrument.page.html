@let instrument = facade.routeInstrument$ | async;

<h1 class="text-xl font-semibold" data-testid="market.instrument.name">
  @if (instrument) {
    {{ instrument.name }}
  } @else {
    <ng-container i18n="@@featureMarket-instrumentPage-title">Instrument</ng-container>
  }
</h1>
@if (instrument) {
  <p class="text-sm text-fg-muted" data-testid="market.instrument.ticker">
    {{ instrument.ticker }}
    @if (instrument.isin) {
      · {{ instrument.isin }}
    }
  </p>
}

<app-panel class="mt-4">
  <app-instrument-chart></app-instrument-chart>
</app-panel>
