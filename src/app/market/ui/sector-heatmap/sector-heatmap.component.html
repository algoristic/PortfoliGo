<ul class="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-6">
  @for (tile of tiles(); track tile.sectorId) {
    <li>
      @if (tile.instrumentId; as instrumentId) {
        <a
          class="flex h-full min-h-16 flex-col justify-between gap-1 rounded-md border border-border p-2 text-fg transition-colors hover:border-fg-muted"
          data-testid="market.overview.sector"
          [attr.data-sector-id]="tile.sectorId"
          [attr.data-level]="tile.level"
          [class]="tile.tileClass"
          [routerLink]="[instrumentId]">
          <span class="text-xs font-medium">{{ tile.label }}</span>
          <span
            class="text-sm font-semibold tabular-nums"
            data-testid="market.overview.sector.change"
            >{{ tile.changeRatio | formatSignedPercent }}</span
          >
        </a>
      } @else {
        <div
          class="flex h-full min-h-16 flex-col justify-between gap-1 rounded-md border border-border p-2 text-fg"
          data-testid="market.overview.sector"
          [attr.data-sector-id]="tile.sectorId"
          [attr.data-level]="tile.level"
          [class]="tile.tileClass">
          <span class="text-xs font-medium">{{ tile.label }}</span>
          <span class="text-sm font-semibold tabular-nums">{{
            tile.changeRatio | formatSignedPercent
          }}</span>
        </div>
      }
    </li>
  }
</ul>
