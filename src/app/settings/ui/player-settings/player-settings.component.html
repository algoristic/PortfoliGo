<fieldset [disabled]="!backgroundMode()">
  <legend class="mb-2 font-medium" i18n="@@uiSettings-playerSettings-backgroundModeLegend">
    Verhalten im Hintergrund
  </legend>
  <div class="flex flex-col gap-2">
    @for (option of backgroundModeOptions(); track option.id) {
      <label
        class="flex cursor-pointer items-start gap-3 rounded-md border border-border p-3 has-checked:border-accent has-checked:bg-surface-raised has-disabled:cursor-default has-disabled:opacity-50">
        <input
          type="radio"
          name="background-mode"
          class="mt-1"
          [value]="option.id"
          [checked]="option.checked"
          [attr.data-testid]="'settings.player.background-mode.' + option.id"
          (change)="onSelectBackgroundMode(option.id)" />
        <span class="flex flex-col">
          <span class="font-medium">{{ option.label }}</span>
          <span class="text-sm text-fg-muted">{{ option.hint }}</span>
        </span>
      </label>
    }
  </div>
</fieldset>
<p class="mt-3 text-sm text-fg-muted" i18n="@@uiSettings-playerSettings-gameStateHint">
  Diese Einstellung gehört zum Spielstand und wird mit dem Spieler exportiert.
</p>
