@let colorScheme = settingsFacade.colorScheme$ | async;
@let shortcutsEnabled = settingsFacade.shortcutsEnabled$ | async;
@let backgroundMode = clockFacade.backgroundMode$ | async;
@let autoPause = notificationsFacade.autoPause$ | async;

<h1 class="text-xl font-semibold" i18n="@@featureSettings-settingsPage-title">Einstellungen</h1>

<div class="mt-4 flex max-w-3xl flex-col gap-4">
  <app-panel
    heading="Dieses Gerät"
    i18n-heading="@@featureSettings-settingsPage-deviceHeading"
    data-testid="settings.device">
    <app-device-settings
      [colorScheme]="colorScheme"
      [shortcutsEnabled]="shortcutsEnabled"
      (selectedColorScheme)="onSelectColorScheme($event)"
      (toggledShortcuts)="onToggleShortcuts($event)"></app-device-settings>
  </app-panel>

  <app-panel
    heading="Spieler"
    i18n-heading="@@featureSettings-settingsPage-playerHeading"
    data-testid="settings.player">
    <app-player-settings
      [backgroundMode]="backgroundMode"
      (selectedBackgroundMode)="onSelectBackgroundMode($event)"></app-player-settings>
    <app-auto-pause-settings
      class="mt-6 border-t border-border pt-4"
      [autoPause]="autoPause"
      (toggledAutoPause)="onToggleAutoPause($event)"></app-auto-pause-settings>
  </app-panel>
</div>
