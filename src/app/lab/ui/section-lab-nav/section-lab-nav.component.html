<nav [attr.aria-label]="navLabel">
  <ul class="flex flex-wrap gap-1">
    @for (item of items(); track item.path) {
      <li>
        <a
          #link="routerLinkActive"
          class="flex items-center gap-2 rounded-md px-3 py-2 text-sm font-medium whitespace-nowrap transition-colors"
          [class]="
            link.isActive
              ? 'bg-surface-raised text-fg'
              : 'text-fg-muted hover:bg-surface-raised hover:text-fg'
          "
          [routerLink]="item.path"
          routerLinkActive
          ariaCurrentWhenActive="page"
          [attr.data-testid]="'lab.nav.' + item.path">
          <i
            class="bi hidden text-base sm:inline"
            [class]="'bi-' + item.icon"
            aria-hidden="true"></i>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
