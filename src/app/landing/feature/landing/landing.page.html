<ion-header>
  <ion-toolbar>
    <ion-title>
      <app-logo></app-logo>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  @let activeUser = usersFacade.activeUser$ | async;
  @if (activeUser) {
    <p>Hallo {{ activeUser.name }}</p>
  }

  @let balance = transactionsFacade.balance$ | async;
  @if (balance) {
    <p>Konto: {{ balance.toLocaleString() | maskito: currency }}</p>
  }
</ion-content>

<ion-fab slot="fixed" vertical="bottom" horizontal="end">
  <ion-fab-button>
    <ion-icon name="person-outline"></ion-icon>
  </ion-fab-button>
  <ion-fab-list side="top">
    <ion-fab-button (click)="landingFacade.logout()">
      <ion-icon name="log-out-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab-list>
</ion-fab>
