@let suggestedSeed = playersFacade.suggestedSeed$ | async;
@let creating = playersFacade.creating$ | async;

<main class="mx-auto flex min-h-dvh max-w-2xl flex-col gap-4 px-4 py-8">
  <p class="text-lg font-semibold text-accent">PortfoliGo</p>
  <h1 class="text-2xl font-semibold" i18n="@@featurePlayers-newPlayerPage-title"
    >Spieler anlegen</h1
  >

  <app-panel>
    @if (suggestedSeed) {
      <app-form-new-player
        [seed]="suggestedSeed"
        [creating]="creating ?? false"
        (clickedSuggestSeed)="onSuggestSeed()"
        (submittedNewPlayer)="onSubmitNewPlayer($event)"></app-form-new-player>
    } @else {
      <app-skeleton [lines]="5"></app-skeleton>
    }
  </app-panel>

  <app-disclaimer-hint aboutLink="/about"></app-disclaimer-hint>
</main>
