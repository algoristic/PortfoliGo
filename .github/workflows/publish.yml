name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build App
    uses: ./.github/workflows/build-latest.yml
    if: ${{ success() }}

  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: build
    if: ${{ success() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build-static
          path: app-build-static

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # The host allows SFTP only, so stale hashed files are removed by mirroring:
      # lftp uploads first and then deletes what the build no longer contains.
      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASS }}
        run: |
          lftp -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            open --env-password -u $SFTP_USER -p $SFTP_PORT sftp://$SFTP_HOST;
            mirror --reverse --delete --verbose --parallel=4 app-build-static /www/portfoligo;
            bye"
