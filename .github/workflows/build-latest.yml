name: Build PortfoliGo (latest)

# Gate of the deployment (TS §14.4): `publish.yml` deploys only after this workflow succeeded as a
# whole. The slower and noisier checks run without blocking in `verify-extended.yml`.

on:
  workflow_call:

jobs:
  static:
    name: Format, lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Format
        run: npx prettier --check .
      - name: Lint
        run: npx ng lint
      # TS §11.9: fails on a missing, outdated or invalid English translation and on a stale
      # `messages.en.json` (`--strict` since AP 6.8b).
      - name: Translations
        run: npm run i18n:check
      - name: Types
        run: npm run typecheck

  unit:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [logic, angular]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Property tests draw new inputs per commit; a rerun of the same commit reproduces them.
      - name: Seed of the property tests
        run: |
          echo "FC_SEED=$((16#${GITHUB_SHA:0:7}))" >> "$GITHUB_ENV"
          echo "fast-check seed: $((16#${GITHUB_SHA:0:7}))" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run test:${{ matrix.suite }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-path: app-build-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Bundle budget
        run: npm run budget
      - uses: actions/upload-artifact@v4
        with:
          name: app-build-static
          path: www
          retention-days: 1

  e2e:
    name: System tests (chromium)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The image brings the browsers and their system libraries; its version matches @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # The system tests check exactly the build that is deployed. The budgets of J10 (`@budget`)
      # run in `verify-extended.yml`.
      - uses: actions/download-artifact@v4
        with:
          name: app-build-static
          path: www
      - run: npx playwright test --project=chromium --project=chromium-intl --grep-invert @budget
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-chromium
          path: playwright-report
          retention-days: 14
