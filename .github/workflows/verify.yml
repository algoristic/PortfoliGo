name: Verify

# Non-blocking checks of TS §14.4, on demand only. The push trigger on `main` is switched off for
# now; the checks run locally before a push.

on:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Extended checks
    uses: ./.github/workflows/verify-extended.yml
