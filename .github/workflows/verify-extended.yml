name: Verify PortfoliGo (extended)

# Checks of TS §14.4 that do not gate the deployment: they are slow or measure wall-clock budgets,
# which are noisy on the runners. `verify.yml` runs them on demand (for now they run locally
# instead of on every push); a failure turns that run red without stopping `publish.yml`.

on:
  workflow_call:

jobs:
  calibration:
    name: Tests (calibration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Property tests draw new inputs per commit; a rerun of the same commit reproduces them.
      - name: Seed of the property tests
        run: |
          echo "FC_SEED=$((16#${GITHUB_SHA:0:7}))" >> "$GITHUB_ENV"
          echo "fast-check seed: $((16#${GITHUB_SHA:0:7}))" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run test:calibration

  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Runners are slower and noisier than the development machine (TS §14.3).
      PERF_FACTOR: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:perf

  # One job per list of `MUTATION_SHARDS` in `stryker.config.mjs`; the matrix must name every shard,
  # `mutation-score` fails if a file was not mutated.
  mutation:
    name: Mutation tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Incremental mode: only mutants in changed code or with changed tests run again.
      - uses: actions/cache/restore@v4
        with:
          path: reports/mutation/incremental.json
          key: stryker-${{ matrix.shard }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ matrix.shard }}-${{ github.ref_name }}-
            stryker-${{ matrix.shard }}-main-
      - id: stryker
        run: npm run test:mutation
      # Saved whenever Stryker finished, also when it failed, so the next run builds on it. A
      # cancelled run (timeout) leaves only the restored file.
      - uses: actions/cache/save@v4
        if: always() && (steps.stryker.outcome == 'success' || steps.stryker.outcome == 'failure')
        with:
          path: reports/mutation/incremental.json
          key: stryker-${{ matrix.shard }}-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-${{ matrix.shard }}
          path: |
            reports/mutation/index.html
            reports/mutation/mutation.json
          retention-days: 14

  mutation-score:
    name: Mutation score
    needs: mutation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-report-*
          path: reports/shards
      - run: node tools/mutation-score.mjs reports/shards

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Bundle budget
        run: npm run budget
      # Own name, because pull requests run this workflow and `build-latest.yml` in one run.
      - uses: actions/upload-artifact@v4
        with:
          name: app-build-verify
          path: www
          retention-days: 1

  e2e:
    name: System tests (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The image brings the browsers and their system libraries; its version matches @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host
    env:
      # J10 measures budgets (TS §14.3); runners are slower and noisier, as in the job `perf`.
      PERF_FACTOR: '2'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One retry: a busy runner sometimes doubles a single J10 measurement (TS §14.3); a real
          # regression exceeds the budget in both runs.
          - name: budgets
            projects: --project=chromium --grep @budget --retries=1
          - name: firefox
            projects: --project=firefox
          - name: webkit
            projects: --project=webkit
          - name: mobile
            projects: --project=mobile-chromium --project=mobile-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: app-build-verify
          path: www
      - run: npx playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-verify-${{ matrix.name }}
          path: playwright-report
          retention-days: 14
